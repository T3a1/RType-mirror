name: CI

on:
  push:
    branches: ['**']
    tags: ['*']
  workflow_dispatch:

env:
  EPITECH_REPO: git@github.com:EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-3.git

# Every job is skipped on the Epitech repo: the forward job pushes this file there too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check formatting
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format
        run: |
          find engine common server client tests -name '*.cpp' -o -name '*.hpp' \
            | xargs -r clang-format --dry-run --Werror

  build-and-test:
    name: Build and test
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # clang-tidy only needs compile_commands.json, not the build: split it over 4 runners.
  lint:
    name: Lint (${{ matrix.shard }}/4)
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-3'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run clang-tidy
        # Each shard takes one file out of four; xargs fails if any clang-tidy run fails.
        run: |
          jq -r '.[].file' build/compile_commands.json | sort \
            | awk -v k=${{ matrix.shard }} 'NR % 4 == k - 1' \
            | xargs -r -P "$(nproc)" -n 1 clang-tidy -p build -quiet --warnings-as-errors='*'

  # The jobs above build the client with Raylib: build and lint the other backends too.
  backends:
    name: Build and lint the ${{ matrix.graphics }} client
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-3'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        graphics: [sfml, ncurses]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          graphics: ${{ matrix.graphics }}
      - name: Build the client
        run: cmake --build build --target r-type_client
      - name: Run clang-tidy on the backend
        run: clang-tidy -p build -quiet --warnings-as-errors='*' client/src/graphics/${{ matrix.graphics }}/*.cpp

  # Keeps the check name required by the "Protect main" ruleset.
  gate:
    name: Build, lint and test
    needs: [build-and-test, lint, backends]
    if: ${{ !cancelled() && github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-3' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the build, test and lint results
        run: |
          test "${{ needs.build-and-test.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.backends.result }}" = success

  docker:
    name: Build server image
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t rtype-server .

  forward:
    name: Push to the Epitech repo
    needs: [format, gate, docker]
    # Only on pushes (not manual runs), and only when every job above passed (so never on the Epitech repo).
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: forward-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load the SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EPITECH_DEPLOY_KEY }}
      - name: Push the ref
        run: git push --force "$EPITECH_REPO" "$GITHUB_SHA:$GITHUB_REF"
