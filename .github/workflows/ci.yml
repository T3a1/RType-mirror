name: CI

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  EPITECH_REPO: git@github.com:EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-3.git

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format
        run: |
          find server client tests -name '*.cpp' -o -name '*.hpp' \
            | xargs -r clang-format --dry-run --Werror

  build-and-test:
    name: Build, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgtest-dev libgmock-dev clang-tidy
      - name: Configure
        run: cmake -B build -G Ninja -DBUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build
      - name: Run clang-tidy
        run: |
          find server client tests -name '*.cpp' \
            | xargs -r clang-tidy -p build --quiet --warnings-as-errors='*'
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  docker:
    name: Build server image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t rtype-server .

  forward:
    name: Push to the Epitech repo
    needs: [format, build-and-test, docker]
    # Only from the mirror, only on pushes (not PRs), and only when every job above passed.
    if: github.event_name == 'push' && github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-3'
    runs-on: ubuntu-24.04
    concurrency:
      group: forward-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load the SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EPITECH_DEPLOY_KEY }}
      - name: Push the ref
        run: git push --force "$EPITECH_REPO" "$GITHUB_SHA:$GITHUB_REF"
